name: ios-device-benchmark

# Build the existing correctness-checked instruction benchmark for a real
# jailbroken iPhone. This workflow is manual because the artifact is useful
# only when a maintainer has a compatible device available; ordinary pushes
# should not spend a macOS runner compiling a second copy of the core.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build no-JIT arm64 iPhone benchmark
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Build signed-engine diagnostic benchmark for iphoneos
        run: |
          set -euo pipefail
          sdkroot="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p device-benchmark
          python3 tools/gen_a64_static.py \
            device-benchmark/a64_static_handlers.S

          # Keep this source graph coupled to the portable core rather than a
          # hand-maintained copy. Like the app, it excludes jit/**. The signed
          # graph and direct-write definitions below deliberately measure a
          # candidate engine; they are NOT the current shipping-app default.
          # Paths in this repository contain no whitespace.
          core_sources=$(find core/src -type f -name '*.c' \
            ! -path 'core/src/jit/*' -print | sort)
          test -n "$core_sources"

          xcrun --sdk iphoneos clang \
            -std=c11 -O3 -flto -DNDEBUG -ffp-contract=off \
            -Wall -Wextra -Werror -Werror=unguarded-availability-new \
            -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$sdkroot" -Icore/include -Itools \
            -D_FILE_OFFSET_BITS=64 \
            -DS5LBOX_STATIC_A64_ENGINE=1 \
            -DS5LBOX_STATIC_A64_NATIVE=1 \
            -DS5LBOX_STATIC_A64_DEFAULT_GRAPH=1 \
            -DS5LBOX_STATIC_A64_DEFAULT_DIRECT_WRITES=1 \
            '-DINSNBENCH_BUILD_TYPE="Release-iPhoneOS-LTO"' \
            tools/insnbench.c tools/a64_static.c \
            $core_sources device-benchmark/a64_static_handlers.S \
            -o device-benchmark/s5lbox-insnbench-ios-arm64

          # This standalone CLI requires a privileged development phone. These
          # are the minimal lab-only CLI entitlements; they do not grant
          # dynamic code or JIT. Keep the plist with the artifact so any
          # necessary phone-side re-sign preserves the exact same contract.
          cp tools/ios-device-benchmark-entitlements.plist \
            device-benchmark/entitlements.plist
          codesign --force --sign - --timestamp=none \
            --entitlements device-benchmark/entitlements.plist \
            device-benchmark/s5lbox-insnbench-ios-arm64
          lipo -info device-benchmark/s5lbox-insnbench-ios-arm64
          codesign --verify --strict --verbose=2 \
            device-benchmark/s5lbox-insnbench-ios-arm64
          codesign --display --entitlements :- \
            device-benchmark/s5lbox-insnbench-ios-arm64 \
            > device-benchmark/embedded-entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          expected = plistlib.loads(
              Path("device-benchmark/entitlements.plist").read_bytes()
          )
          embedded = plistlib.loads(
              Path("device-benchmark/embedded-entitlements.plist").read_bytes()
          )
          if embedded != expected:
              raise SystemExit(
                  f"embedded entitlement mismatch: {embedded!r} != {expected!r}"
              )
          PY
          shasum -a 256 \
            device-benchmark/s5lbox-insnbench-ios-arm64 \
            device-benchmark/entitlements.plist |
            tee device-benchmark/SHA256SUMS

      - name: Upload device benchmark
        uses: actions/upload-artifact@v4
        with:
          name: S5LBox-ios-device-benchmark
          path: |
            device-benchmark/s5lbox-insnbench-ios-arm64
            device-benchmark/entitlements.plist
            device-benchmark/SHA256SUMS
          if-no-files-found: error
