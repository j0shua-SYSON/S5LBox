name: touchhle-tests

on:
  push:
    paths:
      - 'third_party/touchhle/**'
      - 'integrations/touchhle-cpu/**'
      - 'core/**'
      - 'tools/guest_hle_files.*'
      - 'tools/hfs_offline.*'
      - 'app/Sources/VMTouchHLEOfflineFiles.*'
      - 'app/Sources/VMStorageLease.*'
      - 'tools/guest_hle_launch_guard.*'
      - 'tools/guest_hle_routes.*'
      - 'tools/guest_hle_route_service.c'
      - 'tools/guest_hle_springboard.m'
      - 'tools/guest_hle_cfmessageport.h'
      - 'tools/guest_hle_setup.c'
      - 'tools/test_guest_hle_setup.py'
      - 'tools/build_guest_hle.ps1'
      - 'tools/package_guest_hle.py'
      - 'tools/build_touchhle_dylibs.ps1'
      - 'tools/test_guest_hle_files.py'
      - 'tools/guest_package_service.c'
      - 'tools/test_guest_package_service.py'
      - 'app/Sources/VMTouchHLESurface.*'
      - 'app/Sources/VMTouchHLEViewController.*'
      - 'app/Sources/VMPackageBridge.*'
      - 'app/Sources/VMUSBTransport.*'
      - 'app/Sources/VMUSBService.*'
      - 'app/Sources/VMEngine.*'
      - 'app/Sources/EmulatorViewController.m'
      - 'app/Sources/VMRuntimeSettingsViewController.m'
      - 'app/project-touchhle.yml'
      - '.github/workflows/touchhle-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-files:
    name: Guest-owned live filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated file-service fixture
        run: |
          mkdir -p work/hle-files-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -g \
            tools/guest_hle_files.c integrations/touchhle-cpu/fixtures/files_probe.c \
            -o work/hle-files-tests/files-probe
      - name: Verify chroot, privilege drop, live writes and real kernel locks
        run: sudo python3 tools/test_guest_hle_files.py work/hle-files-tests/files-probe
      - name: Verify bounded icon routing and stale-session recovery
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            tools/guest_hle_routes.c integrations/touchhle-cpu/fixtures/routes.c \
            -o work/hle-files-tests/routes
          work/hle-files-tests/routes
      - name: Verify authenticated live files through the package helper
        run: |
          cc -Wall -Wextra -Werror -DS5LBOX_PACKAGE_TEST -I tools \
            tools/guest_package_service.c tools/guest_hle_files.c tools/sha256.c \
            -o work/hle-files-tests/package-service
          sudo python3 tools/test_guest_package_service.py work/hle-files-tests/package-service
  ios-library:
    name: Interpreter library for iOS arm64
    needs: interpreter-runtime
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/touchhle-ios-target
      CARGO_BUILD_JOBS: '3'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CFLAGS: '-std=c11'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
      CMAKE_TOOLCHAIN_FILE_aarch64_apple_ios: ${{ github.workspace }}/third_party/touchhle/s5lbox-ios-arm64.cmake
    steps:
      - uses: actions/checkout@v4
      - name: Select the app's current Xcode toolchain
        # Match ios-build: older default SDKs lack the public pairing header.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - name: Install the iOS Rust target
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios
      - name: Build the static library without code signing or JIT
        run: cargo +stable build --release --locked --manifest-path third_party/touchhle/Cargo.toml --target aarch64-apple-ios --lib
      - name: Verify the library architecture
        run: |
          set -euo pipefail
          archive=work/touchhle-ios-target/aarch64-apple-ios/release/libtouchHLE.a
          test -s "$archive"
          xcrun lipo "$archive" -verify_arch arm64

      - name: Link a native iPhone host-boundary probe
        run: |
          set -euo pipefail
          mkdir -p work/ios-hle-probe
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c11 -Wall -Wextra -Werror \
            integrations/touchhle-cpu/fixtures/host_probe.c \
            work/touchhle-ios-target/aarch64-apple-ios/release/libtouchHLE.a \
            -Wl,-dead_strip -lc++ -liconv -lz -framework Foundation -framework Security \
            -framework SystemConfiguration -framework AVFoundation -framework AudioToolbox \
            -framework CoreAudio -framework CoreBluetooth -framework CoreGraphics -framework CoreHaptics \
            -framework CoreMotion -framework CoreVideo -framework GameController \
            -framework OpenGLES -framework QuartzCore -framework UIKit -framework Metal \
            -o work/ios-hle-probe/hle-host-probe
          xcrun strip -S work/ios-hle-probe/hle-host-probe
          codesign --force --sign - --timestamp=none work/ios-hle-probe/hle-host-probe

      - name: Preserve the native test executable
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-ios-host-probe
          path: work/ios-hle-probe/hle-host-probe

      - name: Get the verified guest fixture
        uses: actions/download-artifact@v4
        with:
          name: touchhle-interpreter-smoke
          path: work/ios-hle-fixture

      - name: Package an ordinary UIKit runtime test host
        run: |
          set -euo pipefail
          app=work/ios-hle-app/Payload/HLEProbe.app
          mkdir -p "$app"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$sdk" -std=c11 -Wall -Wextra -Werror -Dmain=s5lbox_hle_fixture_main \
            -c integrations/touchhle-cpu/fixtures/host_probe.c -o work/ios-hle-app/host-probe.o
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$sdk" -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations \
            integrations/touchhle-cpu/fixtures/ios_probe.m work/ios-hle-app/host-probe.o \
            integrations/touchhle-cpu/fixtures/ios_graphics_probe.m app/Sources/VMTouchHLESurface.m \
            work/touchhle-ios-target/aarch64-apple-ios/release/libtouchHLE.a \
            -Wl,-dead_strip -lc++ -liconv -lz -framework Foundation -framework Security \
            -framework SystemConfiguration -framework AVFoundation -framework AudioToolbox \
            -framework CoreAudio -framework CoreBluetooth -framework CoreGraphics -framework CoreHaptics \
            -framework CoreMotion -framework CoreVideo -framework GameController \
            -framework OpenGLES -framework QuartzCore -framework UIKit -framework Metal \
            -o "$app/HLEProbe"
          cp integrations/touchhle-cpu/fixtures/ios-probe.plist "$app/Info.plist"
          cp -R work/ios-hle-fixture/hle-smoke/InterpreterSmoke.app "$app/"
          cp -R work/ios-hle-fixture/hle-smoke/HLEVisual.app "$app/"
          cp -R third_party/touchhle/touchHLE_dylibs third_party/touchhle/touchHLE_fonts "$app/"
          cp third_party/touchhle/touchHLE_default_options.txt "$app/"
          xcrun strip -S "$app/HLEProbe"
          codesign --force --sign - --timestamp=none "$app/InterpreterSmoke.app"
          codesign --force --sign - --timestamp=none "$app/HLEVisual.app"
          codesign --force --sign - --timestamp=none --entitlements app/S5LBox.entitlements "$app"
          codesign --verify --strict "$app"
          cd work/ios-hle-app
          zip -qry HLEProbe.ipa Payload

      - name: Preserve the UIKit test host
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-ios-test-app
          path: work/ios-hle-app/HLEProbe.ipa

      - uses: actions/download-artifact@v4
        with:
          name: touchhle-guest-launch-package
          path: work/hle-guest-package

      - name: Build the integrated separate-container S5LBox test app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/hle-xcodegen app/Generated
          gh release download 2.46.0 --repo yonaskolb/XcodeGen --pattern xcodegen.zip --dir work/hle-xcodegen --clobber
          unzip -q work/hle-xcodegen/xcodegen.zip -d work/hle-xcodegen
          python3 tools/gen_a64_static.py app/Generated/a64_static_handlers.S
          work/hle-xcodegen/xcodegen/bin/xcodegen generate --spec app/project-touchhle.yml
          xcodebuild -project app/S5LBox.xcodeproj -target S5LBox -configuration Release \
            -sdk iphoneos -arch arm64 CONFIGURATION_BUILD_DIR="$PWD/work/hle-integrated" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > work/hle-integrated-build.log 2>&1 || { tail -100 work/hle-integrated-build.log; exit 1; }
          app=work/hle-integrated/S5LBox.app
          codesign --force --sign - --timestamp=none --entitlements app/S5LBox.entitlements "$app"
          codesign --verify --strict "$app"
          mkdir -p work/hle-integrated-package/Payload
          cp -R "$app" work/hle-integrated-package/Payload/
          cd work/hle-integrated-package
          zip -qry S5LBox-touchHLE.ipa Payload

      - name: Preserve the integrated S5LBox test app
        uses: actions/upload-artifact@v4
        with:
          name: S5LBox-touchHLE-test-app
          path: work/hle-integrated-package/S5LBox-touchHLE.ipa

      - name: Preserve integrated build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-integrated-build-log
          path: work/hle-integrated-build.log
          if-no-files-found: ignore

  interpreter-runtime:
    name: Rust frameworks with the C interpreter
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/touchhle-target
      CARGO_BUILD_JOBS: '3'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CFLAGS: '-std=c11'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check interpreter-only dependency graph
        run: |
          set -euo pipefail
          cargo +stable tree --locked --manifest-path third_party/touchhle/Cargo.toml --edges normal > dependencies.txt
          if grep -i dynarmic dependencies.txt; then
            echo 'The interpreter build must not depend on Dynarmic.' >&2
            exit 1
          fi

      - name: Test the integrated Rust library
        run: cargo +stable test --locked --manifest-path third_party/touchhle/Cargo.toml --lib -- --test-threads=1

      - name: Verify audio pause and resource cleanup without host playback
        env:
          ALSOFT_DRIVERS: 'null'
        run: cargo +stable test --locked --manifest-path third_party/touchhle/Cargo.toml --lib resource_tests -- --ignored --test-threads=1

      - name: Test embedded viewport and input mapping
        run: cargo +stable test --locked --manifest-path third_party/touchhle/Cargo.toml --features native-window --lib window::tests -- --test-threads=1

      - name: Build the headless runtime
        run: cargo +stable build --locked --manifest-path third_party/touchhle/Cargo.toml --bin touchHLE

      - name: Verify native launch exclusion with a live file lease
        run: |
          set -euo pipefail
          mkdir -p work/hle-launch-tests
          xcrun clang -Wall -Wextra -Werror -fblocks -DS5LBOX_HLE_GUARD_TEST \
            '-DS5LBOX_HLE_GUARD_PATH="work/hle-launch-tests/lease"' \
            '-DS5LBOX_HLE_GUARD_PORT="com.j0shua.s5lbox.hle-launch-fixture"' \
            '-DS5LBOX_HLE_ROUTE_PATH="work/hle-launch-tests/route-request"' \
            tools/guest_hle_springboard.m tools/guest_hle_launch_guard.c tools/guest_hle_routes.c \
            integrations/touchhle-cpu/fixtures/launch_guard.m \
            -framework Foundation -framework CoreFoundation -o work/hle-launch-tests/launch-guard
          sudo work/hle-launch-tests/launch-guard
          xcrun clang -Wall -Wextra -Werror -Wno-deprecated-declarations \
            '-DS5LBOX_HLE_SPRINGBOARD_JOB="work/hle-launch-tests/SpringBoard.plist"' \
            tools/guest_hle_setup.c -framework CoreFoundation -o work/hle-launch-tests/guest-setup
          sudo python3 tools/test_guest_hle_setup.py work/hle-launch-tests/guest-setup work/hle-launch-tests/SpringBoard.plist

      - name: Fetch the pinned community test SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/hle-sdk
          gh release download v0.3.7 --repo touchHLE/common-3.0-sdk --pattern common-3.0.sdk-macOS-universal.tar.gz --dir work/hle-sdk --clobber
          tar -xzf work/hle-sdk/common-3.0.sdk-macOS-universal.tar.gz -C work/hle-sdk

      - name: Build the ARM and Thumb test app
        shell: pwsh
        run: |
          $clang=(xcrun --find clang).Trim()
          ./integrations/touchhle-cpu/fixtures/build.ps1 -Clang $clang -SDK work/hle-sdk/common-3.0.sdk -OutputDirectory (Join-Path $PWD 'work/hle-smoke')

      - name: Build the guest launch-guard package
        shell: pwsh
        run: |
          $clang=(xcrun --find clang).Trim()
          $python=(Get-Command python3).Source
          ./tools/build_guest_hle.ps1 -Clang $clang -SDK work/hle-sdk/common-3.0.sdk -BuildDirectory (Join-Path $PWD 'work/hle-guest-package') -Python $python

      - name: Preserve the guest launch-guard package
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-guest-launch-package
          path: work/hle-guest-package/s5lbox-hle-launch.deb

      - name: Run a real Mach-O app through the interpreter and frameworks
        working-directory: third_party/touchhle
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/InterpreterSmoke.app --headless > ../../work/hle-smoke.log 2>&1
          cat ../../work/hle-smoke.log
          grep -F 'S5LBOX-HLE-SMOKE PASS failures=0' ../../work/hle-smoke.log
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/InterpreterSmoke.app --headless --args --condition-smoke > ../../work/hle-condition.log 2>&1
          cat ../../work/hle-condition.log
          grep -F 'S5LBOX-HLE-CONDITION PASS failures=0' ../../work/hle-condition.log

      - name: Preserve smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-interpreter-smoke
          path: |
            work/hle-smoke.log
            work/hle-condition.log
            work/hle-smoke/InterpreterSmoke.app
            work/hle-smoke/HLEVisual.app
            work/hle-smoke/LibrarySmoke.app
          if-no-files-found: ignore

      - name: Run bundled ARMv6 compression, database and XML code
        working-directory: third_party/touchhle
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/LibrarySmoke.app --headless > ../../work/hle-dylibs.log 2>&1
          cat ../../work/hle-dylibs.log
          grep -F 'S5LBOX-HLE-DYLIBS PASS failures=0' ../../work/hle-dylibs.log

      - name: Verify UIKit touch cancellation and Foundation compatibility
        working-directory: third_party/touchhle
        timeout-minutes: 2
        run: |
          set -euo pipefail
          result=0
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/HLEVisual.app --headless --preferred-languages=en --args --cancel-smoke > ../../work/hle-cancel.log 2>&1 || result=$?
          cat ../../work/hle-cancel.log
          test "$result" -eq 0
          grep -F 'S5LBOX-HLE-CANCEL PASS failures=0' ../../work/hle-cancel.log
          result=0
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/HLEVisual.app --headless --preferred-languages=en --args --provider-smoke > ../../work/hle-provider.log 2>&1 || result=$?
          cat ../../work/hle-provider.log
          test "$result" -eq 0
          grep -F 'S5LBOX-HLE-PROVIDER PASS failures=0' ../../work/hle-provider.log
          result=0
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/HLEVisual.app --headless --preferred-languages=en --args --permissions-smoke > ../../work/hle-permissions.log 2>&1 || result=$?
          cat ../../work/hle-permissions.log
          test "$result" -eq 0
          grep -F 'S5LBOX-HLE-PERMISSIONS PASS failures=0' ../../work/hle-permissions.log

      - name: Reuse one host process after guest exits and faults
        working-directory: third_party/touchhle
        timeout-minutes: 3
        env:
          S5LBOX_HLE_SMOKE_APP: ${{ github.workspace }}/work/hle-smoke/InterpreterSmoke.app
        run: |
          set -euo pipefail
          cargo +stable test --locked --test runtime_lifecycle -- --ignored --nocapture --test-threads=1 > ../../work/hle-lifecycle.log 2>&1
          cat ../../work/hle-lifecycle.log
          grep -F 'S5LBOX-HLE-LIFECYCLE PASS' ../../work/hle-lifecycle.log

      - name: Verify the host ABI and responsive stop controls
        working-directory: third_party/touchhle
        timeout-minutes: 3
        env:
          S5LBOX_HLE_SMOKE_APP: ${{ github.workspace }}/work/hle-smoke/InterpreterSmoke.app
        run: |
          set -euo pipefail
          cargo +stable test --locked --test host_boundary -- --ignored --nocapture --test-threads=1 > ../../work/hle-host.log 2>&1
          cat ../../work/hle-host.log
          grep -F 'S5LBOX-HLE-HOST PASS' ../../work/hle-host.log

      - name: Verify optimized embedded runtime and fault recovery
        working-directory: third_party/touchhle
        env:
          ALSOFT_DRIVERS: 'null'
          S5LBOX_HLE_SMOKE_APP: ${{ github.workspace }}/work/hle-smoke/InterpreterSmoke.app
        run: |
          set -euo pipefail
          cargo +stable test --release --locked \
            --features native-window --lib -- --test-threads=1
          cargo +stable test --release --locked \
            --features native-window --lib resource_tests -- --ignored --test-threads=1
          cargo +stable test --release --locked \
            --features native-window --test runtime_lifecycle --test host_boundary \
            -- --ignored --nocapture --test-threads=1

      - name: Preserve lifecycle-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-interpreter-lifecycle
          path: |
            work/hle-lifecycle.log
            work/hle-host.log
            work/hle-provider.log
            work/hle-permissions.log
            work/hle-cancel.log
            work/hle-dylibs.log
          if-no-files-found: ignore
