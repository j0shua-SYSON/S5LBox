name: ios-build

# Builds the iOS app on a standard hosted macOS runner, subject to GitHub's
# current usage and billing policy. It ad-hoc/fake-signs with ldid — no Apple
# Developer account required — and uploads a candidate .ipa for a compatible
# jailbroken device. The workflow does not install or launch it.
on:
  push:
    paths:
      - 'app/**'
      - 'core/**'
      # The app compiles eight C files out of tools/, plus generated assembly
      # (see app/project.yml, which lists them rather than pulling in the
      # directory). Without
      # these, a change to one of them cannot trigger this workflow -- and that
      # is not hypothetical: d38f1c4 FIXED an iOS build break in
      # tools/rootfs_work.c and did not run this job, because the fix touched
      # only tools/. Listed individually, mirroring project.yml, so ordinary
      # desktop-harness churn in tools/ does not spend macOS runner minutes.
      - 'tools/file_block.c'
      - 'tools/guest_patch.c'
      - 'tools/ios3_bringup_gate.c'
      - 'tools/ios3_bringup_gate.h'
      - 'tools/ios3_hle.c'
      - 'tools/ios3_hle.h'
      - 'tools/ios3_kernel_patch.c'
      - 'tools/ios3_kernel_patch.h'
      - 'tools/rootfs_work.c'
      - 'tools/rootfs_work.h'
      - 'tools/sha256.c'
      - 'tools/sha256.h'
      - 'tools/file_block.h'
      - 'tools/guest_patch.h'
      - 'tools/a64_static.c'
      - 'tools/a64_static.h'
      - 'tools/gen_a64_static.py'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      experimental_hle:
        description: 'Build an explicitly labelled native-raster HLE candidate'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: build ad-hoc-signed .ipa
    runs-on: macos-15
    env:
      EXPERIMENTAL_HLE: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_hle && 'true' || 'false' }}
      IPA_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_hle && 'S5LBox-hle-experimental-ipa' || 'S5LBox-ipa' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (pinned) + ldid
        # Pin XcodeGen to a known-good release so a previously-green build can't
        # break from Homebrew drift (a newer XcodeGen could emit a project format
        # the runner's Xcode can't read). Bump deliberately, not implicitly.
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.46.0
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version
          brew install ldid

      - name: Select newest installed Xcode
        # XcodeGen emits the Xcode 16 project format (objectVersion 77); pick the
        # highest-versioned Xcode present so xcodebuild can read it.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Compile-check every JIT source for iphoneos
        # The app deliberately excludes jit/** until the run loop owns a code
        # cache. Keep the exact iOS preprocessor/API path from silently rotting
        # in the meantime, especially the no-pthread A9 RWX policy.
        run: |
          set -euo pipefail
          sdkroot="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -std=c11 -Wall -Wextra -Werror -Werror=unguarded-availability-new \
            -arch arm64 -miphoneos-version-min=13.0 \
            -DS5LBOX_JIT=1 -Icore/include -isysroot "$sdkroot" \
            -fsyntax-only \
            core/src/jit/a64_emit.c \
            core/src/jit/jit_translate.c \
            core/src/jit/jit_mem.c

      - name: Generate Xcode project
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p Generated
          python3 ../tools/gen_a64_static.py \
            Generated/a64_static_handlers.S
          test -s Generated/a64_static_handlers.S
          xcodegen generate

      - name: Build (unsigned, arm64/iphoneos)
        working-directory: app
        run: |
          set -euo pipefail
          build_settings=()
          if [ "$EXPERIMENTAL_HLE" = true ]; then
            build_settings+=("OTHER_CFLAGS=-DS5LBOX_IOS3_HLE_EXPERIMENT=1")
          fi
          xcodebuild \
            -project S5LBox.xcodeproj \
            -target S5LBox \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$PWD/dist" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${build_settings[@]}" \
            build
          binary="$PWD/dist/S5LBox.app/S5LBox"
          test -f "$binary"
          xcrun nm "$binary" |
            awk '$NF == "_a64_static_execute" { found=1 }
                 END { exit !found }'
          if [ "$EXPERIMENTAL_HLE" = true ]; then
            xcrun nm "$binary" |
              awk '$NF == "_vm_firmware_hle_enable" { found=1 }
                   END { exit !found }'
          fi

      - name: Fake-sign + package .ipa
        working-directory: app
        run: |
          set -euo pipefail
          APP="dist/S5LBox.app"
          test -d "$APP"
          # Request the declared entitlements and ad-hoc sign. Whether the
          # target jailbreak grants them must be validated on that device.
          ldid -S"S5LBox.entitlements" "$APP/S5LBox"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry S5LBox.ipa Payload
          ls -lh S5LBox.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_ARTIFACT }}
          path: app/S5LBox.ipa
          if-no-files-found: error
