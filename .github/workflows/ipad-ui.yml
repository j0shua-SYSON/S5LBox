name: ipad-ui
on:
  push:
    paths: ['app/**', '.github/workflows/ipad-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode and project
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          mkdir -p app/Generated
          python3 tools/gen_a64_static.py app/Generated/a64_static_handlers.S
          cd app
          xcodegen generate --spec project-tests.yml
      - name: Select iPad simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          devices = json.load(open('/tmp/devices.json'))['devices']
          for runtime, entries in sorted(devices.items(), reverse=True):
              matches = [d for d in entries if d['name'].startswith('iPad') and d.get('isAvailable')]
              if matches:
                  print('id=' + matches[0]['udid'])
                  break
          else:
              raise SystemExit('No available iPad simulator')
          PY
      - name: Build iPad tests and seed file-picker fixtures
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild -project S5LBox.xcodeproj -scheme S5LBox-iPad \
            -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$PWD/../work/ipad-build" \
            -parallel-testing-enabled NO -jobs 2 \
            CODE_SIGNING_ALLOWED=NO LLVM_LTO=NO GCC_OPTIMIZATION_LEVEL=0 \
            COMPILER_INDEX_STORE_ENABLE=NO build-for-testing > ../iPad-build.log 2>&1 || {
              tail -150 ../iPad-build.log; exit 1;
            }
          simulator='${{ steps.simulator.outputs.id }}'
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" "$PWD/../work/ipad-build/Build/Products/Debug-iphonesimulator/S5LBox.app"
          container=$(xcrun simctl get_app_container "$simulator" com.j0shua.S5LBox data)
          python3 - "$container" <<'PY'
          import pathlib, plistlib, sys, zipfile
          fixtures = pathlib.Path(sys.argv[1]) / 'Documents' / 'PickerFixtures'
          fixtures.mkdir(parents=True, exist_ok=True)
          (fixtures / 'Picker-firmware.ipsw').write_bytes(b'not an IPSW archive')
          with zipfile.ZipFile(fixtures / 'Picker-app.ipa', 'w') as archive:
              archive.writestr('Payload/Fixture.app/Info.plist', plistlib.dumps({
                  'CFBundleIdentifier': 'org.example.picker-fixture',
                  'CFBundleName': 'Picker Fixture', 'CFBundleExecutable': 'Fixture',
                  'CFBundleVersion': '1', 'MinimumOSVersion': '3.0'}))
          PY
      - name: Test iPad setup, file selection, layouts and rotation
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild -project S5LBox.xcodeproj -scheme S5LBox-iPad \
            -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$PWD/../work/ipad-build" \
            -resultBundlePath "$PWD/../iPad-tests.xcresult" \
            -parallel-testing-enabled NO -jobs 2 \
            CODE_SIGNING_ALLOWED=NO LLVM_LTO=NO GCC_OPTIMIZATION_LEVEL=0 \
            COMPILER_INDEX_STORE_ENABLE=NO test-without-building 2>&1 | tee ../iPad-tests.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-test-logs
          path: |
            iPad-tests.log
            iPad-build.log
          retention-days: 7
      - name: Export interface screenshots
        if: always()
        run: |
          if [ -f iPad-tests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path iPad-tests.xcresult --output-path iPad-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('iPad-tests.xcresult/Info.plist') != ''
        with:
          name: iPad-test-results
          path: |
            iPad-tests.xcresult
            iPad-tests.log
            iPad-build.log
            iPad-screenshots
          retention-days: 7
