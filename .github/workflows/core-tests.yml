name: core-tests

# The emulator core is portable C11 — it builds and unit-tests on any host,
# so we gate every push on it. Fast (seconds) and device-independent.
on:
  push:
    paths:
      - 'core/**'
      - 'tools/**'
      # app/Sources WHOLESALE, and not the three or four files that happen to
      # be compiled here today.
      #
      # This list used to name 'app/Sources/VMGuest.c' and its header, which was
      # precise and wrong: core/CMakeLists.txt also builds VMBootOptions.c,
      # VMOptions.c and VMJitProbe.c into test targets, and none of them were
      # here. On 2026-07-29 a fix to VMJitProbe.c ran ios-build only -- the one
      # job that does NOT compile it for Linux -- so the -Werror=clobbered
      # failure it was fixing could not be re-tested at all, and the push looked
      # like it had passed.
      #
      # A filter that has to be kept in lockstep with another file's target
      # definitions will drift, silently, in the direction of testing less. The
      # cost of the wildcard is some Objective-C edits running a matrix that
      # cannot observe them; the cost of the old form was a build-breaking
      # change no job compiled.
      - 'app/Sources/**'
      - 'app/Tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/core-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------------------------------------------------------------------
      # Interpreter throughput. A MEASUREMENT, NOT A GATE.
      #
      # docs/dynarec.md §1.1-§1.2 is explicit that every throughput number in it
      # is a desktop x86-64 number and that every target-device figure is
      # INFERRED or GUESS. This matrix already builds the same core on
      # ubuntu-latest and windows-latest (x86-64) and macos-latest (Apple
      # Silicon, arm64), so the missing ARM64 measurement costs one step: the
      # same binary, from the same commit, on the same day, on both ISAs. That
      # is what makes the arm64/x86 ratio real rather than a comparison against
      # historical numbers taken on a different tree with a different compiler.
      #
      # continue-on-error is deliberate and must stay. A hosted runner is
      # shared, virtualised and noisy, so any threshold here would either be so
      # loose it caught nothing or would flake on a busy neighbour; a real
      # performance regression test needs a stable machine, which CI is not.
      # The step can still go red on a BROKEN harness — insnbench exits non-zero
      # when a run fails its architectural end-state check — and that stays
      # visible in the job summary without failing the build.
      #
      # Runtime is roughly 2-3 minutes per runner at these settings; the two
      # tick=yes rows are most of it. Trim --reps or --insns if that ever
      # matters more than matching §1.1's 20,000,000-instruction sample size.
      - name: Interpreter throughput (measurement, not a gate)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "=== host ==="
          uname -a || true
          uname -m || true
          echo "=== toolchain (the -O level the numbers below were built with) ==="
          grep -E '^CMAKE_C_COMPILER:|^CMAKE_C_FLAGS(_RELEASE)?:|^CMAKE_BUILD_TYPE:' \
            build/CMakeCache.txt || true
          echo "=== insnbench ==="
          bin="$(find build -type f \( -name insnbench -o -name insnbench.exe \) | head -n 1)"
          if [ -z "$bin" ]; then
            echo "insnbench was not built" >&2
            exit 1
          fi
          "$bin" --insns 20000000 --reps 5

      # JIT executability. A MEASUREMENT, NOT A GATE — for the same reason as
      # the step above: it reports a host POLICY, and asserting one would make
      # this a test of the runner rather than of the code. ctest already gates
      # the contract (survivable, self-consistent) and suppresses the output of
      # a test that passes, so the verdict itself was going unrecorded.
      #
      # docs/dynarec.md §0.1: every throughput number in §10.3 is conditional on
      # whether a device will branch into a page the process wrote, and that has
      # only ever been asked of the phone. These runners cannot answer for iOS —
      # macOS policy is far more permissive, and Linux is a different OS
      # entirely — but they do show the probe working on arm64 Apple hardware
      # before it is trusted on a user's device, which is worth having written
      # down rather than assumed.
      - name: JIT executability probe (measurement, not a gate)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          bin=$(find build -name 'test_vmjitprobe*' -type f -perm -u+x | head -1)
          if [ -z "$bin" ]; then
            echo "test_vmjitprobe was not built" >&2
            exit 1
          fi
          uname -sm || true
          "$bin"

  jit:
    # The dynamic recompiler (docs/dynarec.md). It is off in the default build,
    # so it needs a job of its own or it would never be compiled at all.
    #
    # Two different things are being checked here, and the matrix reflects
    # that:
    #
    #   ubuntu-latest (x86_64) — the emitter and the block translator are pure
    #     computation, so their byte-exact tests run anywhere. The execution
    #     test detects a non-arm64 host and reports SKIP.
    #
    #   macos-14 / macos-15 (Apple Silicon, arm64) — the ONLY place emitted
    #     code is actually executed, which is the only way to show the
    #     encodings compute the right answers rather than merely being
    #     well-formed. The gate is at runtime, not in CMake: test_jit_exec asks
    #     whether the host can execute and obtain executable memory. The
    #     explicit verdict step rejects a macOS skip or plain-RWX fallback:
    #     losing MAP_JIT execution coverage is itself a CI failure.
    #
    # Ubuntu's expected x86 skip remains allowed and is checked exactly.
    name: jit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Report host architecture
        run: uname -m

      - name: Configure (JIT and signed-static engine on)
        run: >-
          cmake -S . -B build-jit -DCMAKE_BUILD_TYPE=Release
          -DS5LBOX_JIT=ON -DS5LBOX_STATIC_A64_ENGINE=ON

      - name: Build
        run: cmake --build build-jit --config Release

      - name: Test
        run: ctest --test-dir build-jit --output-on-failure

      - name: Verify JIT and signed-static execution verdicts
        run: |
          set -euo pipefail
          set +e
          memory_output="$(./build-jit/core/test_jit_mem 2>&1)"
          memory_status=$?
          output="$(./build-jit/core/test_jit_exec 2>&1)"
          status=$?
          soc_output="$(./build-jit/core/test_soc 2>&1)"
          soc_status=$?
          set -e
          printf '%s\n' "$memory_output"
          printf '%s\n' "$output"
          printf '%s\n' "$soc_output"
          test "$memory_status" -eq 0
          test "$status" -eq 0
          test "$soc_status" -eq 0
          grep -Eq '[1-9][0-9]* passed, 0 failed' <<<"$memory_output"
          if [ "$RUNNER_OS" = "macOS" ]; then
            set +e
            static_output="$(./build-jit/core/jitbench --insns 10000 --reps 1 2>&1)"
            static_status=$?
            set -e
            printf '%s\n' "$static_output"
            test "$static_status" -eq 0
            if grep -Fq 'SKIP:' <<<"$memory_output"; then
              echo 'Required macOS MAP_JIT memory-policy coverage was skipped.' >&2
              exit 1
            fi
            if grep -Fq 'SKIP:' <<<"$output"; then
              echo 'The required macOS arm64 JIT execution coverage was skipped.' >&2
              exit 1
            fi
            grep -Fq 'code buffer policy: MAP_JIT + pthread_jit_write_protect_np' <<<"$output"
            grep -Eq '[1-9][0-9]* passed, 0 failed' <<<"$output"
            grep -Eq 'STATIC-A64-SOC-ORACLE exact=yes retired=[1-9][0-9]* smc=yes decoded=yes graph=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-BRANCH-SOC-ORACLE exact=yes retired=[1-9][0-9]* chains=[1-9][0-9]* conditional=yes link=yes taken=yes fallthrough=yes graph=yes' <<<"$soc_output"
            grep -Fq 'STATIC-A64-CHAIN-BOUND-ORACLE exact=yes one-retired=1 one-chains=0 sixteen-retired=16 sixteen-chains=15 persistent-chains=15' <<<"$soc_output"
            grep -Fq 'STATIC-A64-GRAPH-BOUND-ORACLE exact=yes one-retired=1 one-chains=0 one-graph=0 sixteen-retired=16 sixteen-chains=15 sixteen-graph=15 raw-witness=yes collision-republish=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VFP-REGISTER-ORACLE exact=yes retired=[1-9][0-9]* compare=yes widen=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VFP-READ-ORACLE exact=yes retired=[1-9][0-9]* cold-fill=yes double=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-THUMB-ORACLE exact=yes retired=[1-9][0-9]*' <<<"$soc_output"
            grep -Eq 'STATIC-A64-THUMB-READ-ORACLE exact=yes retired=[1-9][0-9]*' <<<"$soc_output"
            grep -Fq 'STATIC-BRANCH-SHAPE exact=yes conditional=14 link=15 handlers=29 forward=yes backward=yes' <<<"$static_output"
            grep -Fq 'STATIC-BRANCH-ORACLE exact=yes cases=58 taken=yes fallthrough=yes link=yes backward=yes contract=yes' <<<"$static_output"
            grep -Eq 'STATIC-VFP-COMPARE-SHAPE exact=yes insns=8 uops=9 handlers=24646' <<<"$static_output"
            grep -Eq 'STATIC-VFP-COMPARE-ORACLE exact=yes ops=15 single=yes double=yes nan=yes fz=yes zero-prefix=yes partial-prefix=yes' <<<"$static_output"
            grep -Eq 'STATIC-VFP-WIDEN-SHAPE exact=yes insns=8 uops=9 handlers=24646' <<<"$static_output"
            grep -Eq 'STATIC-VFP-WIDEN-ORACLE exact=yes ops=15 finite=yes subnormal=yes nan=yes fz=yes zero-prefix=yes partial-prefix=yes' <<<"$static_output"
            grep -Eq 'PRODUCT-ENTRY-CEILING length=1 uops=1 guest-insns=10000 reps=1 predecoded=yes validated-wrapper=yes decoded-contract=yes cache-lookup=no' <<<"$static_output"
            grep -Eq 'PRODUCT-ENTRY-CEILING length=16 uops=16 guest-insns=10000 reps=1 predecoded=yes validated-wrapper=yes decoded-contract=yes cache-lookup=no' <<<"$static_output"
            grep -Eq 'SOC-ENTRY-CURVE length=1 uops=1 guest-insns=10000 reps=1 run-api=yes cache-lookup=yes raw-witness=yes .*exact-snapshot=yes signed-retired=10000 signed-chains=[1-9][0-9]* graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-ENTRY-CURVE length=16 uops=16 guest-insns=10000 reps=1 run-api=yes cache-lookup=yes raw-witness=yes .*exact-snapshot=yes signed-retired=10000 signed-chains=[1-9][0-9]* graph-chains=[1-9][0-9]*' <<<"$static_output"
          else
            grep -Fq 'SKIP: not an arm64 host' <<<"$output"
            grep -Fq 'STATIC-A64-SOC-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-BRANCH-SOC-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-CHAIN-BOUND-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-GRAPH-BOUND-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-VFP-REGISTER-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-VFP-READ-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-THUMB-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-THUMB-READ-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
          fi

      - name: Native/static-semantics ceilings (measurement, not a gate)
        if: runner.arch == 'ARM64'
        continue-on-error: true
        run: >-
          ./build-jit/core/jitbench --insns 500000000
          --entry-insns 100000000 --soc-insns 20000000 --reps 3

      - name: Configure and build with the JIT off
        # The default build must stay green and unchanged; this is the guard
        # against the option leaking into it.
        run: |
          cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release
          cmake --build build-off --config Release
          ctest --test-dir build-off --output-on-failure

  sanitize:
    # The emulator parses untrusted, user-supplied firmware and executes guest
    # code that can address anything, so run the whole suite under the address
    # and undefined-behaviour sanitizers. These are unavailable on the Windows
    # dev machine, which makes this job the real safety net.
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (sanitizers)
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DS5LBOX_JIT=ON \
            -DS5LBOX_STATIC_A64_ENGINE=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure

  strict:
    # Every C target, including host tools and the app's portable bridge, must
    # remain warning-free.  Keep this hosted: the user's development machine is
    # intentionally reserved for tiny checks and may not have the same compiler.
    name: warnings as errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (strict warnings)
        run: |
          cmake -S . -B build-strict \
            -DCMAKE_BUILD_TYPE=Debug \
            -DS5LBOX_JIT=ON \
            -DS5LBOX_STATIC_A64_ENGINE=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build-strict

      - name: Test
        run: ctest --test-dir build-strict --output-on-failure
