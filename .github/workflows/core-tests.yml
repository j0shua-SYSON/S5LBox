            grep -Eq 'STATIC-VFP-WIDEN-ORACLE exact=yes ops=15 finite=yes subnormal=yes nan=yes fz=yes zero-prefix=yes partial-prefix=yes' <<<"$static_output"
            grep -Fq 'STATIC-VFP-NARROW-ORACLE exact=yes accepted=8 fallbacks=12 aliases=yes inexact=yes conditions=yes partial-prefix=yes host-fp-state=yes runtime-codegen=no' <<<"$static_output"
            grep -Eq 'PRODUCT-ENTRY-CEILING length=1 uops=1 guest-insns=10000 reps=1 predecoded=yes validated-wrapper=yes decoded-contract=yes cache-lookup=no' <<<"$static_output"
            grep -Eq 'PRODUCT-ENTRY-CEILING length=16 uops=16 guest-insns=10000 reps=1 predecoded=yes validated-wrapper=yes decoded-contract=yes cache-lookup=no' <<<"$static_output"
            grep -Eq 'SOC-ENTRY-CURVE length=1 uops=1 guest-insns=10000 reps=1 chain-limit=16 extended-limit=256 run-api=yes cache-lookup=yes block-witness=yes .*exact-snapshot=yes signed-retired=10000 signed-chains=[1-9][0-9]* graph-chains=[1-9][0-9]* extended-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-ENTRY-CURVE length=16 uops=16 guest-insns=10000 reps=1 chain-limit=16 extended-limit=256 run-api=yes cache-lookup=yes block-witness=yes .*exact-snapshot=yes signed-retired=10000 signed-chains=[1-9][0-9]* graph-chains=0 extended-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-STORE-CURVE length=16 stores=4 guest-insns=10000 reps=1 chain-limit=256 run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=7500 on-signed-retired=10000 dwrite-hits=2500 dwrite-misses=0 off-graph-chains=[0-9]+ on-graph-chains=[0-9]+' <<<"$static_output"
            grep -Eq 'SOC-FETCH-REFILL-CURVE blocks=4 loop-insns=4 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=section tlb=warm exact-snapshot=yes off-signed-retired=0 adaptive-signed-retired=[1-9][0-9]* adaptive-refill-attempts=[1-9][0-9]* adaptive-refill-hits=[1-9][0-9]* adaptive-refill-skips=[1-9][0-9]* refill-accounting=10000/10000' <<<"$static_output"
            grep -Eq 'SOC-FETCH-REFILL-MIX-CURVE blocks=20 single-blocks=3 long-blocks=17 long-insns=10 loop-insns=173 guest-insns=10034 reps=1 single-call-share=15.000% observed-single-share=15.342% observed-multi-mean=9.463 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=section tlb=warm exact-snapshot=yes off-signed-retired=8874 adaptive-signed-retired=[1-9][0-9]* adaptive-refill-attempts=[1-9][0-9]* adaptive-refill-hits=[1-9][0-9]* adaptive-refill-skips=[1-9][0-9]* refill-accounting=1160/1160' <<<"$static_output"
            grep -Eq 'SOC-INDIRECT-CURVE heads=4 loop-insns=8 indirect=4 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=5000 on-signed-retired=10000 off-graph-chains=0 on-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-THUMB-COND-CURVE length=16 branches=4 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off taken=yes fallthrough=yes exact-snapshot=yes off-signed-retired=7500 on-signed-retired=10000 off-graph-chains=[0-9]+ on-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-VSTR-CURVE length=16 vstr=4 dwrite-words=6 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=7500 on-signed-retired=10000 dwrite-hits=3750 dwrite-misses=0 off-graph-chains=[0-9]+ on-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-STM-CURVE length=16 stm=4 dwrite-words=12 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=7500 on-signed-retired=10000 dwrite-hits=7500 dwrite-misses=0 off-graph-chains=[0-9]+ on-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-LDM-CURVE length=16 ldm=4 dread-words=12 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=7500 on-signed-retired=10000 dread-hits=7500 dread-misses=0 off-graph-chains=[0-9]+ on-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-VSTM-CURVE length=16 vstm=4 dwrite-words=16 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=7500 on-signed-retired=10000 dwrite-hits=10000 dwrite-misses=0 off-graph-chains=[0-9]+ on-graph-chains=[1-9][0-9]*' <<<"$static_output"
            grep -Eq 'SOC-VFP-ARITH-CURVE length=16 arithmetic=15 guest-insns=10000 reps=1 chain-limit=256 same-binary=yes run-api=yes cache-lookup=yes block-witness=yes entry-gates=yes timer-boundaries=yes device-tick=yes head-cache=warm mmu=off exact-snapshot=yes off-signed-retired=625 unbatched-signed-retired=10000 batched-signed-retired=10000 off-graph-chains=[0-9]+ unbatched-graph-chains=[1-9][0-9]* batched-graph-chains=[1-9][0-9]*' <<<"$static_output"
          else
            grep -Fq 'SKIP: not an arm64 host' <<<"$output"
            grep -Fq 'STATIC-A64-SOC-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-STORE-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-STM-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-LDM-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-VSTM-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-BRANCH-SOC-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-THUMB-COND-SOC-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-INDIRECT-SOC-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-CHAIN-BOUND-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-GRAPH-BOUND-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-VFP-REGISTER-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-VFP-ARITH-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-VFP-READ-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-THUMB-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
            grep -Fq 'STATIC-A64-THUMB-READ-ORACLE SKIP: no signed AArch64 handlers' <<<"$soc_output"
          fi

      - name: Compact raw semantic-loop ceiling (measurement, not phone FPS)
        if: runner.arch == 'ARM64'
        run: >-
          ./build-jit/core/jitbench --compact-raw-only
          --insns 500000000 --reps 3

      - name: Compact raw SoC-entry ceiling (measurement, not phone FPS)
        if: runner.arch == 'ARM64'
        run: >-
          ./build-jit/core/jitbench --compact-raw-soc-only
          --soc-insns 200000000 --reps 3

      - name: Native/static-semantics ceilings (measurement, not a gate)
        if: runner.arch == 'ARM64'
        continue-on-error: true
        run: >-
          ./build-jit/core/jitbench --insns 500000000
          --entry-insns 100000000 --soc-insns 20000000 --reps 3

      # The representative mix showed only a small result at three short
      # repetitions. Keep the expensive confirmation opt-in: each arm uses the
      # same binary and exact serialized-state gate, while nine rotated pairs
      # make the paired ratio more meaningful than a ratio of separate medians.
      - name: Long paired fetch-refill confirmation (measurement, not phone FPS)
        if: runner.arch == 'ARM64' && inputs.fetch_refill_confirmation
        run: >-
          ./build-jit/core/jitbench --fetch-refill-mix-only
          --soc-insns 200000000 --reps 9

      - name: Configure and build with the JIT off
        # The default build must stay green and unchanged; this is the guard
        # against the option leaking into it.
        run: |
          cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release
          cmake --build build-off --config Release
          ctest --test-dir build-off --output-on-failure

  sanitize:
    # The emulator parses untrusted, user-supplied firmware and executes guest
    # code that can address anything, so run the whole suite under the address
    # and undefined-behaviour sanitizers. These are unavailable on the Windows
    # dev machine, which makes this job the real safety net.
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (sanitizers)
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DS5LBOX_JIT=ON \
            -DS5LBOX_STATIC_A64_ENGINE=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure

  strict:
    # Every C target, including host tools and the app's portable bridge, must
    # remain warning-free.  Keep this hosted: the user's development machine is
    # intentionally reserved for tiny checks and may not have the same compiler.
    name: warnings as errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (strict warnings)
        run: |
          cmake -S . -B build-strict \
            -DCMAKE_BUILD_TYPE=Debug \
            -DS5LBOX_JIT=ON \
            -DS5LBOX_STATIC_A64_ENGINE=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build-strict

      - name: Test
        run: ctest --test-dir build-strict --output-on-failure
