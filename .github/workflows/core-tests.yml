name: core-tests

# The emulator core is portable C11 — it builds and unit-tests on any host,
# so we gate every push on it. Fast (seconds) and device-independent.
on:
  push:
    paths:
      - 'core/**'
      - 'tools/**'
      # app/Sources WHOLESALE, and not the three or four files that happen to
      # be compiled here today.
      #
      # This list used to name 'app/Sources/VMGuest.c' and its header, which was
      # precise and wrong: core/CMakeLists.txt also builds VMBootOptions.c,
      # VMOptions.c and VMJitProbe.c into test targets, and none of them were
      # here. On 2026-07-29 a fix to VMJitProbe.c ran ios-build only -- the one
      # job that does NOT compile it for Linux -- so the -Werror=clobbered
      # failure it was fixing could not be re-tested at all, and the push looked
      # like it had passed.
      #
      # A filter that has to be kept in lockstep with another file's target
      # definitions will drift, silently, in the direction of testing less. The
      # cost of the wildcard is some Objective-C edits running a matrix that
      # cannot observe them; the cost of the old form was a build-breaking
      # change no job compiled.
      - 'app/Sources/**'
      - 'app/Tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/core-tests.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      fetch_refill_confirmation:
        description: Run the long paired Apple fetch-refill confirmation
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------------------------------------------------------------------
      # Interpreter throughput. A MEASUREMENT, NOT A GATE.
      #
      # docs/dynarec.md §1.1-§1.2 is explicit that every throughput number in it
      # is a desktop x86-64 number and that every target-device figure is
      # INFERRED or GUESS. This matrix already builds the same core on
      # ubuntu-latest and windows-latest (x86-64) and macos-latest (Apple
      # Silicon, arm64), so the missing ARM64 measurement costs one step: the
      # same binary, from the same commit, on the same day, on both ISAs. That
      # is what makes the arm64/x86 ratio real rather than a comparison against
      # historical numbers taken on a different tree with a different compiler.
      #
      # continue-on-error is deliberate and must stay. A hosted runner is
      # shared, virtualised and noisy, so any threshold here would either be so
      # loose it caught nothing or would flake on a busy neighbour; a real
      # performance regression test needs a stable machine, which CI is not.
      # The step can still go red on a BROKEN harness — insnbench exits non-zero
      # when a run fails its architectural end-state check — and that stays
      # visible in the job summary without failing the build.
      #
      # Runtime is roughly 2-3 minutes per runner at these settings; the two
      # tick=yes rows are most of it. Trim --reps or --insns if that ever
      # matters more than matching §1.1's 20,000,000-instruction sample size.
      - name: Interpreter throughput (measurement, not a gate)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "=== host ==="
          uname -a || true
          uname -m || true
          echo "=== toolchain (the -O level the numbers below were built with) ==="
          grep -E '^CMAKE_C_COMPILER:|^CMAKE_C_FLAGS(_RELEASE)?:|^CMAKE_BUILD_TYPE:' \
            build/CMakeCache.txt || true
          echo "=== insnbench ==="
          bin="$(find build -type f \( -name insnbench -o -name insnbench.exe \) | head -n 1)"
          if [ -z "$bin" ]; then
            echo "insnbench was not built" >&2
            exit 1
          fi
          "$bin" --insns 20000000 --reps 5

      # JIT executability. A MEASUREMENT, NOT A GATE — for the same reason as
      # the step above: it reports a host POLICY, and asserting one would make
      # this a test of the runner rather than of the code. ctest already gates
      # the contract (survivable, self-consistent) and suppresses the output of
      # a test that passes, so the verdict itself was going unrecorded.
      #
      # docs/dynarec.md §0.1: every throughput number in §10.3 is conditional on
      # whether a device will branch into a page the process wrote, and that has
      # only ever been asked of the phone. These runners cannot answer for iOS —
      # macOS policy is far more permissive, and Linux is a different OS
      # entirely — but they do show the probe working on arm64 Apple hardware
      # before it is trusted on a user's device, which is worth having written
      # down rather than assumed.
      - name: JIT executability probe (measurement, not a gate)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          bin=$(find build -name 'test_vmjitprobe*' -type f -perm -u+x | head -1)
          if [ -z "$bin" ]; then
            echo "test_vmjitprobe was not built" >&2
            exit 1
          fi
          uname -sm || true
          "$bin"

  jit:
    # The dynamic recompiler (docs/dynarec.md). It is off in the default build,
    # so it needs a job of its own or it would never be compiled at all.
    #
    # Two different things are being checked here, and the matrix reflects
    # that:
    #
    #   ubuntu-latest (x86_64) — the emitter and the block translator are pure
    #     computation, so their byte-exact tests run anywhere. The execution
    #     test detects a non-arm64 host and reports SKIP.
    #
    #   macos-14 / macos-15 (Apple Silicon, arm64) — the ONLY place emitted
    #     code is actually executed, which is the only way to show the
    #     encodings compute the right answers rather than merely being
    #     well-formed. The gate is at runtime, not in CMake: test_jit_exec asks
    #     whether the host can execute and obtain executable memory. The
    #     explicit verdict step rejects a macOS skip or plain-RWX fallback:
    #     losing MAP_JIT execution coverage is itself a CI failure.
    #
    # Ubuntu's expected x86 skip remains allowed and is checked exactly.
    name: jit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Report host architecture
        run: uname -m

      - name: Configure (JIT and signed-static engine on)
        run: >-
          cmake -S . -B build-jit -DCMAKE_BUILD_TYPE=Release
          -DS5LBOX_JIT=ON -DS5LBOX_STATIC_A64_ENGINE=ON

      - name: Build
        run: cmake --build build-jit --config Release

      - name: Test
        run: ctest --test-dir build-jit --output-on-failure

      - name: Verify JIT and signed-static execution verdicts
        run: |
          set -euo pipefail
          set +e
          memory_output="$(./build-jit/core/test_jit_mem 2>&1)"
          memory_status=$?
          output="$(./build-jit/core/test_jit_exec 2>&1)"
          status=$?
          soc_output="$(./build-jit/core/test_soc 2>&1)"
          soc_status=$?
          set -e
          printf '%s\n' "$memory_output"
          printf '%s\n' "$output"
          printf '%s\n' "$soc_output"
          test "$memory_status" -eq 0
          test "$status" -eq 0
          test "$soc_status" -eq 0
          grep -Eq '[1-9][0-9]* passed, 0 failed' <<<"$memory_output"
          if [ "$RUNNER_OS" = "macOS" ]; then
            set +e
            static_output="$(./build-jit/core/jitbench --insns 10000 --reps 1 2>&1)"
            static_status=$?
            compact_output="$(./build-jit/core/jitbench --compact-raw-only --insns 10000 --reps 1 2>&1)"
            compact_status=$?
            compact_soc_output="$(./build-jit/core/jitbench --compact-raw-soc-only --soc-insns 10000 --reps 1 2>&1)"
            compact_soc_status=$?
            set -e
            printf '%s\n' "$static_output"
            printf '%s\n' "$compact_output"
            printf '%s\n' "$compact_soc_output"
            test "$static_status" -eq 0
            test "$compact_status" -eq 0
            test "$compact_soc_status" -eq 0
            if grep -Fq 'SKIP:' <<<"$memory_output"; then
              echo 'Required macOS MAP_JIT memory-policy coverage was skipped.' >&2
              exit 1
            fi
            if grep -Fq 'SKIP:' <<<"$output"; then
              echo 'The required macOS arm64 JIT execution coverage was skipped.' >&2
              exit 1
            fi
            grep -Fq 'code buffer policy: MAP_JIT + pthread_jit_write_protect_np' <<<"$output"
            grep -Eq '[1-9][0-9]* passed, 0 failed' <<<"$output"
            grep -Eq 'STATIC-A64-SOC-ORACLE exact=yes retired=[1-9][0-9]* smc=yes decoded=yes graph=yes refill=yes' <<<"$soc_output"
            grep -Fq 'STATIC-A64-STORE-ORACLE exact=yes dwrite-hit=1 terminal=yes smc-witness=yes stale-edges=0' <<<"$soc_output"
            grep -Eq 'STATIC-A64-STM-ORACLE exact=yes retired=[1-9][0-9]* dwrite-hits=29999 dwrite-misses=1 modes=4 writeback=yes pc-source=yes conditional=yes max-words=16 graph=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-LDM-ORACLE exact=yes retired=[1-9][0-9]* dread-hits=11999 dread-misses=1 modes=4 writeback=no no-pc=yes graph=yes rollout=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VSTM-ORACLE exact=yes retired=[1-9][0-9]* dwrite-hits=69999 dwrite-misses=1 modes=3 single=yes double=yes odd-single=yes max-words=32 writeback=yes conditional=yes graph=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-BRANCH-SOC-ORACLE exact=yes retired=[1-9][0-9]* chains=[1-9][0-9]* conditional=yes link=yes taken=yes fallthrough=yes graph=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-THUMB-COND-SOC-ORACLE exact=yes retired=[1-9][0-9]* chains=[1-9][0-9]* conditions=eq-ne taken=yes fallthrough=yes thumb-state=yes graph=yes rollout=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-INDIRECT-SOC-ORACLE exact=yes retired=[1-9][0-9]* chains=[1-9][0-9]* a32-bx=yes a32-blx=yes thumb-bx=yes thumb-blx=yes arm-to-thumb=yes thumb-to-arm=yes graph=yes' <<<"$soc_output"
            grep -Fq 'STATIC-A64-CHAIN-BOUND-ORACLE exact=yes one-retired=1 one-chains=0 sixteen-retired=16 sixteen-chains=15 persistent-chains=15' <<<"$soc_output"
            grep -Fq 'STATIC-A64-GRAPH-BOUND-ORACLE exact=yes one-retired=1 one-chains=0 one-graph=0 sixteen-retired=16 sixteen-chains=15 sixteen-graph=15 extended-retired=64 extended-chains=63 extended-graph=63 first-timebase-edge=yes block-witness=4 collision-republish=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VFP-REGISTER-ORACLE exact=yes retired=[1-9][0-9]* compare=yes widen=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VFP-ARITH-ORACLE exact=yes off-retired=[0-9]+ on-retired=16000 graph=[1-9][0-9]* operations=15 single=yes double=yes same-machine=yes rollout=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VFP-READ-ORACLE exact=yes retired=[1-9][0-9]* cold-fill=yes double=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-VFP-WRITE-ORACLE exact=yes retired=[1-9][0-9]* dwrite-hits=32998 dwrite-misses=2 double=yes boundary=yes graph=yes' <<<"$soc_output"
            grep -Eq 'STATIC-A64-THUMB-ORACLE exact=yes retired=[1-9][0-9]*' <<<"$soc_output"
            grep -Eq 'STATIC-A64-THUMB-READ-ORACLE exact=yes retired=[1-9][0-9]*' <<<"$soc_output"
            grep -Fq 'STATIC-BRANCH-SHAPE exact=yes conditional=14 link=15 handlers=29 forward=yes backward=yes' <<<"$static_output"
            grep -Fq 'STATIC-THUMB-COND-BRANCH-SHAPE exact=yes conditions=14 handlers=reused forward=yes backward=yes terminal=yes mid-block-refused=yes rollout=yes' <<<"$static_output"
            grep -Fq 'STATIC-INDIRECT-BRANCH-SHAPE exact=yes a32-bx=16 a32-blx=15 thumb-bx=16 thumb-blx=15 handlers=62 conditional=yes terminal=yes guarded=yes' <<<"$static_output"
            grep -Fq 'STATIC-STORE-SHAPE exact=yes a32=6 thumb=7 terminal=yes read-contract=preserved handlers=26509' <<<"$static_output"
            grep -Fq 'STATIC-STORE-ORACLE exact=yes cases=15 hits=14 pc-source=yes writeback=yes unprivileged=yes thumb=yes zero-prefix=yes partial-prefix=yes' <<<"$static_output"
            grep -Fq 'STATIC-STM-SHAPE exact=yes modes=4 bases=15 sources=16 writeback=15 conditional=yes pc-source=yes max-words=16 transactional=yes terminal=yes read-contract=preserved handlers=26509' <<<"$static_output"
            grep -Fq 'STATIC-STM-ORACLE exact=yes cases=6 hit-words=31 modes=4 writeback=yes pc-source=yes conditional=yes max-words=16 one-block=yes cross-block-rollback=yes alignment=yes cold-cache=yes consent=yes' <<<"$static_output"
            grep -Fq 'STATIC-LDM-SHAPE exact=yes modes=4 bases=15 destinations=15 writeback=15 conditional=yes max-words=15 transactional=yes nonterminal=yes pc=no user-bank=no handlers=26509' <<<"$static_output"
            grep -Fq 'STATIC-LDM-ORACLE exact=yes cases=6 hit-words=30 modes=4 writeback=yes base-in-list=yes conditional=yes max-words=15 one-block=yes cross-block-rollback=yes alignment=yes cold-cache=yes stale-cache=yes contract=yes nonterminal=yes' <<<"$static_output"
            grep -Fq 'STATIC-VSTM-WRITE-SHAPE exact=yes modes=3 bases=15 single-words=1-32 double-words=even-2-32 FSTMX=no terminal=yes read-contract=preserved handlers=26509' <<<"$static_output"
            grep -Fq 'STATIC-VSTM-WRITE-ORACLE exact=yes cases=6 hit-words=70 modes=3 single=yes double=yes odd-single=yes max-words=32 writeback=yes conditional=yes one-block=yes cross-block-rollback=yes alignment=yes cold-cache=yes consent=yes VFP-guard=yes FSTMX=no' <<<"$static_output"
            grep -Fq 'STATIC-BRANCH-ORACLE exact=yes cases=58 taken=yes fallthrough=yes link=yes backward=yes contract=yes' <<<"$static_output"
            grep -Fq 'STATIC-THUMB-COND-BRANCH-ORACLE exact=yes cases=28 conditions=all taken=yes fallthrough=yes backward=yes thumb-state=yes lr-preserved=yes contract=yes' <<<"$static_output"
            grep -Fq 'STATIC-INDIRECT-BRANCH-ORACLE exact=yes cases=240 a32-conditions=yes registers=all arm-target=yes thumb-target=yes link=yes pc-source=yes invalid-rollback=yes contract=yes' <<<"$static_output"
            grep -Fq 'COMPACT-RAW-ADMISSION-MODEL exact-shapes=yes cases=70 outcomes=13 condition-before-decode=yes machine-gates=excluded' <<<"$static_output"
            grep -Fq 'COMPACT-RAW-ORACLE exact=yes cases=10 result-opcodes=12 flag-opcodes=16 conditions=14 immediate-rotate=yes register-immediate-shifts=all word-load-store=yes branch-link=yes live-bytes=yes mmu-code-window=yes data-ops-stop=yes out-of-window=yes unsupported-prefix=yes invalid-contract-rollback=yes' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-THUMB-ORACLE exact=yes cases=116 immediate-shifts=boundaries register-shifts=0-1-31-32-33 alu=all high-register=yes extend=yes memory-kinds=all stack-multiple=yes branches=all-conditions long-branch-pairs=2 state-switch=yes' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-A32-INDIRECT-ORACLE exact=yes cases=177 conditions=all registers=all arm-target=yes thumb-target=yes link=yes pc-source=yes invalid-rollback=yes condition-before-guard=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-VFP-NONARITH-ORACLE exact=yes cases=46 core-system=yes unary=yes compare=yes widen=yes nan=yes fz=yes lazy-access=yes condition-before-guard=yes' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-VFP-ARITH-ORACLE exact=yes operations=9 widths=2 accepted=20 signed-zero=yes inexact=yes fallbacks=25 conditions=yes partial-prefix=yes host-fp-state=yes host-fp-session=yes callback-boundary=yes callback-no-retire=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-VFP-NARROW-ORACLE exact=yes accepted=8 fallbacks=12 aliases=yes inexact=yes post-round-rejection=yes conditions=yes partial-prefix=yes host-fp-state=yes callback-boundary=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-VFP-MEMORY-ORACLE exact=yes cases=21 vldr=yes vstr=yes vstm=yes single=yes double=yes pc-relative=yes writeback=yes condition-before-guard=yes transactional=yes flat-ram=yes cache-telemetry=excluded runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-VFP-RESIDENT-MEMORY-ORACLE exact=yes cases=21 vldr=yes vstr=yes vstm=yes dread=yes dwrite=yes hit-accounting=yes native-only=yes fallback=zero transactional=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-THUMB-MULTI-ORACLE exact=yes cases=11 refusals=7 push=yes pop=yes stmia=yes ldmia=yes lr=yes pc-interwork=yes base-lowest=yes base-in-list=yes max-words=9 transactional=yes flat-ram=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-THUMB-MULTI-RESIDENT-ORACLE exact=yes cases=11 dread=yes dwrite=yes hit-accounting=yes native-only=yes fallback=zero resident-refusals=5 cold-cache=yes stale-cache=yes consent=yes cross-block=yes invalid-target=yes transactional=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-A32-REGISTER-SHIFT-ORACLE exact=yes cases=1797 refusals=4 opcodes=all result-flags=both types=all amounts=0-1-7-31-32-33-64-255 amount-low8=yes carry=both aliases=rd-rs-rd-rm-rd-rn-rs-rm-rn-rs pc-guards=all runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-A32-BLOCK-ORACLE exact=yes cases=17 refusals=8 stm=yes ldm=yes modes=4 writeback=yes base-lowest-writeback=yes base-in-list=yes pc-store=yes pc-load-interwork=yes max-words=16 condition-before-guard=yes transactional=yes fallback-convergence=yes flat-ram=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-A32-BLOCK-RESIDENT-ORACLE exact=yes cases=17 stm=yes ldm=yes dread=yes dwrite=yes hit-accounting=yes native-only=yes fallback=zero resident-refusals=5 cold-cache=yes stale-cache=yes consent=yes cross-block=yes invalid-target=yes transactional=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-A32-SINGLE-ORACLE exact=yes cases=24 refusals=8 word=yes byte=yes immediate=yes register-shifts=all indexing=pre-post writeback=yes unprivileged=yes pc-base=yes pc-store=yes pc-load-interwork=yes condition-before-guard=yes transactional=yes fallback-convergence=yes flat-ram=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-A32-SINGLE-RESIDENT-ORACLE exact=yes cases=24 dread=yes dwrite=yes privilege-tags=yes hit-accounting=yes native-only=yes fallback=zero resident-refusals=5 cold-cache=yes stale-cache=yes consent=yes invalid-target=yes transactional=yes runtime-codegen=no' <<<"$compact_output"
            grep -Fq 'COMPACT-RAW-RESIDENT-ORACLE exact=yes cases=7 native-fallback-partition=yes interpreter-continue=yes boundary-stop=yes window-sequential=yes window-branch=yes window-refusal=yes stale-window-rejection=yes thumb-memory=yes write-consent=yes ram-equality=yes runtime-codegen=no' <<<"$compact_output"
            grep -Eq 'SOC-COMPACT-RAW-PRIVILEGED-ORACLE exact=yes modes=6 states=a32,thumb cases=12 minimum-native=[34] banked-registers=yes mmu=on privileged-native-prefix=yes privileged-fallback=no control=user-only boundary=svc serialized-machine=yes runtime-codegen=no' <<<"$compact_soc_output"
            grep -Fq 'SOC-COMPACT-RAW-THUMB-HALFWORD-ORACLE exact=yes pc=0x2 alignment=halfword native=1 fallback=0 serialized-machine=yes runtime-codegen=no' <<<"$compact_soc_output"
            grep -Fq 'SOC-COMPACT-RAW-RESIDENT-ORACLE exact=yes guest-insns=8192 loop-insns=8 mmu=on native=7168 fallback=1024 dread-hits=1024 dwrite-hits=1024 data-cache-hit=yes write-consent=yes unsupported-fallback=yes timebase-bounded=yes device-tick=yes serialized-machine=yes runtime-codegen=no' <<<"$compact_soc_output"
            grep -Eq 'SOC-COMPACT-RAW-WINDOW-ORACLE exact=yes guest-insns=8256 window-bytes=1024 crossings=[1-9][0-9]* reloads=[1-9][0-9]* stops=0 sequential-cross=yes branch-cross=yes witness-reload=yes timebase-bounded=yes serialized-machine=yes runtime-codegen=no' <<<"$compact_soc_output"
            grep -Eq 'COMPACT-RAW-CEILING case=a32-alu guest-insns=10000 reps=1 live-bytes=yes decoded-cache=no graph=no runtime-codegen=no .*compact-speedup=[0-9.]+x' <<<"$compact_output"
