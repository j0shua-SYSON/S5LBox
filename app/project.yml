# XcodeGen spec for the S5LBox app.
#
# We do NOT commit an .xcodeproj (it is a churny binary blob). CI runs
# `xcodegen generate` on the macOS runner to produce S5LBox.xcodeproj from
# this file, then `xcodebuild`. To develop locally on a Mac, run the same
# `xcodegen generate` and open the project.
name: S5LBox
options:
  bundleIdPrefix: com.j0shua
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

targets:
  S5LBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The app icon. A single 1024x1024 RGB image; Xcode derives every other
      # size from it. It must have NO alpha channel -- the source art was RGBA
      # and was composited onto black before being placed here, because iOS
      # rejects an icon with transparency rather than flattening it for you.
      - path: Assets.xcassets
      # Compile the platform-independent emulator core straight into the app.
      - path: ../core/src
        name: core
        # The dynamic recompiler (docs/dynarec.md) is deliberately NOT in the
        # app yet. It is gated by the CMake option S5LBOX_JIT for host builds
        # and nothing in the machine's run loop calls it, so compiling it in
        # would add code to the shipping binary that cannot run. Delete this
        # exclusion at stage J3, when the app enables the JIT for real.
        excludes:
          - "jit/**"
      # The firmware importer authenticates what it produces against known-good
      # SHA-256 digests, and the exact kernel and rootfs host policies already
      # share this one implementation. Pulled in as a single file rather than as
      # all of tools/, which is desktop harness code that has no business in a
      # phone binary.
      - path: ../tools/sha256.c
        group: core
      # BOOTING APPLE'S KERNEL needs five more of those files, and no more.
      # Each is portable C that already has a host test and is already built by
      # core/CMakeLists.txt, so none of it is first compiled here:
      #
      #   ios3_bringup_gate.c  binds the gate below to core/src/boot/bringup.c
      #   ios3_kernel_patch.c  the exact 7E18 identity gate and its five patch
      #                        sites -- host POLICY, deliberately not in the
      #                        portable core (see core/include/md_bridge.h)
      #   guest_patch.c        the bounded, all-or-nothing patch transaction
      #   file_block.c         the writable work image as a vm_block_t
      #   rootfs_work.c        makes that work image from the imported rootfs
      #
      # They are listed one by one rather than as `path: ../tools` because the
      # rest of that directory is desktop harness code -- bootkernel.c alone is
      # 27,000 lines of diagnostics -- which has no business in a phone binary.
      - path: ../tools/ios3_bringup_gate.c
        group: core
      - path: ../tools/ios3_kernel_patch.c
        group: core
      - path: ../tools/guest_patch.c
        group: core
      - path: ../tools/file_block.c
        group: core
      - path: ../tools/rootfs_work.c
        group: core
    # Linked explicitly rather than relying on module auto-linking: the display
    # path calls into CoreGraphics (CGImageCreate) and QuartzCore (CALayer
    # filters) directly, and "it happened to link via UIKit" is not something to
    # discover on a CI runner.
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_NAME: S5LBox
        PRODUCT_BUNDLE_IDENTIFIER: com.j0shua.S5LBox
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: S5LBox.entitlements
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/include
          - $(SRCROOT)/../tools
        GCC_C_LANGUAGE_STANDARD: c11
        # tools/file_block.c does 64-bit random access into a ~450 MB work
        # image. iOS's off_t is already 64-bit, so this is belt rather than
        # braces -- but core/CMakeLists.txt sets it for the same file on every
        # non-Windows host, and a build that differs from the tested one only
        # in a width is the kind of difference that shows up as a silently
        # truncated root filesystem.
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - _FILE_OFFSET_BITS=64
        # Stated rather than inherited: the Objective-C sources are written for
        # ARC, and would leak (or double-free) under manual retain/release.
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        # Signing is handled after the build by ldid fake-signing (see CI).
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
